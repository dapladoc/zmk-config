# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# Dongle (item/721, ergosplits.ru) runs englmaxi/zmk-dongle-display
# (SSD1306 128x64 OLED). Originally assumed XIAO-BLE-based purely from
# product photos matching that project's demo images/case designs -- but
# the physical unit's UF2 bootloader identifies itself as
# "Board-ID: nRF52840-nicenano" (confirmed 2026-07-17 while flashing:
# blank OLED + bootloader VID/PID 239a:00b3 "Adafruit nice!nano" turned
# out to mean the board never actually left bootloader, because
# board=xiao_ble's devicetree doesn't have an `xiao_i2c` bus that matches
# real nice!nano hardware -- the display overlay's I2C node was silently
# inert). Switched to board=nice_nano (matching the peripherals, which
# were always correctly nice_nano) and the overlay's I2C bus reference
# updated from `xiao_i2c` to `pro_micro_i2c` accordingly (see
# boards/shields/sweep/sweep_central_dongle.overlay).
include:
  # CONFIG_BT_SUBRATING=n was forced here 2026-07-17 while chasing a
  # peripheral dropping connection ~1min after going idle; re-enabled
  # 2026-07-17 to test whether it was ever actually the cause (that test
  # got confounded by other issues happening in parallel -- a BLE bond
  # reset, then separately discovering the real typing bug, missing
  # CONFIG_ZMK_USB). If the drop recurs, re-add `-DCONFIG_BT_SUBRATING=n`
  # to each cmake-args below (a plain shield .conf override is silently
  # ignored -- the softdevice-controller snippet's own .conf sets it to y
  # with higher merge precedence, so it must go here as a cmake-arg).
  - board: nice_nano
    shield: sweep_central_dongle dongle_display
    artifact-name: sweep_central_dongle
#    snippet: studio-rpc-usb-uart softdevice-controller
    snippet: softdevice-controller
  - board: nice_nano
    shield: sweep_peripheral_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: softdevice-controller
    artifact-name: sweep_peripheral_left
  - board: nice_nano
    shield: sweep_peripheral_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    snippet: softdevice-controller
    artifact-name: sweep_peripheral_right
  - board: nice_nano
    shield: settings_reset
    artifact-name: nicenano_settings_reset
