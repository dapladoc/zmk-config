CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_KEYBOARD_NAME="Sweep"

# Root cause of "keypresses register on the dongle but never type
# anything" (found 2026-07-17 via `lsusb -v`: the USB config descriptor
# had bNumInterfaces=0, no HID interface at all): CONFIG_ZMK_USB was
# never enabled anywhere in this config. It's an opt-in toggle in ZMK
# core (zmk/app/Kconfig), not on by default -- our earlier USB
# output-select keys (&out OUT_USB / OUT_TOG) could never have worked
# regardless of Config-layer access, since there was no USB endpoint to
# select in the first place.
CONFIG_ZMK_USB=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# disable BLE on peripheral
# NOTE: keep default (=y) if want to pairing BLE host on split central, or wireless dongle
CONFIG_ZMK_BLE=y

# disable default split transport on central and peripheral
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_WIRED=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
#CONFIG_BT_ATT_TX_COUNT=10

# OLED status screen (dapladoc/zmk-dongle-display fork, based on
# englmaxi/zmk-dongle-display -- see west.yml) -- ZMK_DISPLAY and the
# dedicated-thread stack size are set by that shield's own
# dongle_display.conf when included in build.yaml; enable the WPM meter
# (off by that shield's own default). Dongle battery display left off:
# this dongle is USB-powered only, no physical battery to report.
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
# Commit hash moved off-screen (was crowding "Active <hash>" into one long
# row) -- build.sh now writes it to artifacts/ instead, see that script.
CONFIG_ZMK_DONGLE_DISPLAY_BUILD_INFO=n