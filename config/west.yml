manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: kmobs
      url-base: https://github.com/kmobs
    - name: englmaxi
      url-base: https://github.com/englmaxi
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-feature-softdevice-subrating
      remote: kmobs
      repo-path: zmk-softdevice-controller
      revision: main
      import: config/west.yml
    - name: zmk-dongle-display
      remote: englmaxi
      # EXPERIMENT (2026-07-16): tracking main again now that zmk core is
      # also on upstream main -- main's zmk_endpoint_get_selected() should
      # match current ZMK's endpoint API. See
      # docs/superpowers/plans/2026-07-16-upstream-zmk-migration-experiment.md
      revision: main
  self:
    path: config
